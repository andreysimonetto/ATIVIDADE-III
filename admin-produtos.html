<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Beka Esporte - Gerenciar Produtos</title>
  <style>
    :root {
      --primary-color: #2d1b4e;
      --secondary-color: #a78bdb;
      --light-bg: #f3e8ff;
      --border-color: #e9d5ff;
      --shadow: 0 10px 30px rgba(45, 27, 78, 0.1);
    }
    body { font-family: 'Segoe UI', sans-serif; background: #fff; margin: 0; }
    header { background: var(--primary-color); color: #fff; padding: 1rem; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px;
            padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 2rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: .35rem; }
    .form-group input, .form-group select {
      width: 100%; padding: .7rem; border: 2px solid var(--border-color);
      border-radius: 8px; font-size: 1rem;
    }
    .btn-primary { background: var(--secondary-color); color: #fff; border: none;
                   padding: .8rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-primary:hover { background: var(--primary-color); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { background: var(--light-bg); }
    .btn-edit { background: #3b82f6; color: #fff; border: none; padding: .35rem .7rem;
                border-radius: 6px; cursor: pointer; margin-right: .35rem; }
    .btn-del  { background: #ef4444; color: #fff; border: none; padding: .35rem .7rem;
                border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <header><h2>Beka Esporte — Gerenciar Produtos</h2></header>

  <div class="container">
    <div class="card">
      <h3 id="formTitle">Novo Produto</h3>
      <form id="form-produto">
        <input type="hidden" id="produto-id">
        <div class="form-row">
          <div class="form-group">
            <label>Nome</label>
            <input type="text" id="nome" required>
          </div>
          <div class="form-group">
            <label>Categoria</label>
            <input type="text" id="categoria" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Preço (R$)</label>
            <input type="number" step="0.01" id="preco" required>
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="descricao" required>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="btnSalvar">Adicionar</button>
      </form>
    </div>

    <div class="card">
      <h3>Produtos cadastrados</h3>
      <table>
        <thead>
          <tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Ações</th></tr>
        </thead>
        <tbody id="tabela-produtos"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="admin-produtos.js"></script>
</body>
</html>
